<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to DO Notes</title>
    <link rel="stylesheet" href="clipper.css" />
  </head>
  <body>
    <main class="popup">
      <h1><img src="icons/icon-32.png" alt="" width="20" height="20" /> Save to DO Notes</h1>
      <p id="what" class="muted">This page goes to your Inbox.</p>
      <div class="actions">
        <button id="save" class="primary">Save page</button>
        <button id="selection" hidden>Save selection</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="muted small"><a href="options.html" id="options">Options</a> · Right-click a picture or selected words to save just that.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
